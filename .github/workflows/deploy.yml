name: Deploy

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image_tag:
        required: true
        type: string
        description: "Image tag (commit SHA) to deploy"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: txodds
  EKS_CLUSTER: txodds-cluster

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_GHA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name $EKS_CLUSTER --region $AWS_REGION

      - name: Install ALB Ingress Controller
        run: |
          if ! helm status aws-load-balancer-controller -n kube-system &>/dev/null; then
            helm repo add eks https://aws.github.io/eks-charts
            helm repo update
            VPC_ID=$(aws eks describe-cluster --name $EKS_CLUSTER --region $AWS_REGION --query 'cluster.resourcesVpcConfig.vpcId' --output text)
            helm install aws-load-balancer-controller eks/aws-load-balancer-controller --version 3.5.0 \
              -n kube-system \
              --set clusterName=$EKS_CLUSTER \
              --set serviceAccount.name=aws-load-balancer-controller \
              --set vpcId=$VPC_ID \
              --set region=$AWS_REGION \
              --set replicaCount=2
          fi
          kubectl rollout status deployment/aws-load-balancer-controller -n kube-system --timeout=300s

      - name: Create namespace
        run: kubectl get namespace txodds || kubectl create namespace txodds

      - name: Diff with Helm
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          helm plugin install https://github.com/databus23/helm-diff 2>/dev/null || true
          helm diff upgrade --install txodds app/app \
            -n txodds \
            --set image.repository=$REGISTRY/$ECR_REPOSITORY \
            --set image.tag=$IMAGE_TAG

      - name: Deploy with Helm
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          helm upgrade --install txodds app/app \
            -n txodds \
            --set image.repository=$REGISTRY/$ECR_REPOSITORY \
            --set image.tag=$IMAGE_TAG

      - name: Print endpoint
        run: |
          INGRESS_NAME=$(kubectl get ingress -n txodds -o jsonpath='{.items[0].metadata.name}')
          kubectl wait ingress/$INGRESS_NAME -n txodds --for=jsonpath='{.status.loadBalancer.ingress[0].hostname}' --timeout=120s
          echo "Endpoint URL: http://$(kubectl get ingress $INGRESS_NAME -n txodds -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')"
